name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Paper API ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.20.6-R0.1-SNAPSHOT
          - 1.21.4-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify -Dpaper.version=${{ matrix.paper }}
      - name: Upload coverage report
        if: matrix.paper == '1.21.4-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
